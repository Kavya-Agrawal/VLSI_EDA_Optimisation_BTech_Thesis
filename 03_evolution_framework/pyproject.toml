[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rszevolve"
version = "0.1.0"
description = "Planner / coder / evaluator agents that evolve OpenROAD's Resizer (rsz) for better WNS/TNS"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["rszevolve*"]

[tool.setuptools.package-data]
rszevolve = ["agents/prompts/*.md", "eval/tcl/*.tcl", "context/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
